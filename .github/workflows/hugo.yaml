name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mergeway-cli
        uses: actions/checkout@v5
        with:
          repository: mergewayhq/mergeway-cli
          path: mergeway-cli

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build website
        working-directory: mergeway-cli
        run: devenv shell -- make website-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mergeway-cli/website/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
